[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "crawler-api"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "crawler-contracts",
  "cryptography>=46,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.22,<1",
  "pydantic-settings>=2.8,<3",
  "pyyaml>=6.0.3,<7",
  "sqlalchemy[asyncio]>=2.0.39,<3",
  "uvicorn[standard]>=0.34,<1",
]

[tool.uv.sources]
crawler-contracts = { workspace = true }

[project.scripts]
provision-agent = "crawler_api.ops.provision_agent:main"
crawler-api-provision-agent = "crawler_api.ops.provision_agent:main"
rotate-agent-credential = "crawler_api.ops.rotate_agent_credential:main"
disable-agent = "crawler_api.ops.disable_agent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crawler_api"]
